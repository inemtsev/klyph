kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
# Kotlin/Native incremental compilation (default on Apple hosts from Kotlin 2.5; opt in here).
kotlin.incremental.native=true
# SDL3 is found automatically (Homebrew, /usr/local, /usr). To use another install, uncomment and
# set the folder that contains include/SDL3/SDL.h and lib/, or pass -Psdl3.prefix=<path>.
#sdl3.prefix=/opt/homebrew
# The engine build expects an installed SDL3. Without one, the klyph plugin, which every module
# applies, stops and names the folders it searched instead of downloading SDL's release.
klyph.sdl3.download=false
# With several targets (-Pklyph.targets=all) nativeMain is a shared source set; commonizing the
# cinterop klibs lets it, and the IDE, see the sdl3, stb and vorbis declarations.
kotlin.mpp.enableCInteropCommonization=true
# Off a Mac, Kotlin/Native would build macOS klibs only for modules without cinterop, and those
# would then depend on a klyph-platform klib that cannot be built there. Off a Mac every module
# leaves macosArm64 out instead; macOS hosts build every target either way.
kotlin.native.enableKlibsCrossCompilation=false
