name: Docs

# Builds the API reference with Dokka and deploys it to GitHub Pages, at
# https://inemtsev.github.io/klyph/. Pages must be set to deploy from GitHub Actions in the
# repository settings (Settings, Pages, Source: GitHub Actions), and the github-pages environment
# must allow tags matching v* to deploy (Settings, Environments, github-pages, Deployment branches
# and tags); with only the main branch allowed, the deploy job of a tag is rejected.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One deployment at a time; a newer run waits instead of cancelling one that is deploying.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Dokka analyses the klyph sources, which need the SDL3 cinterop, which needs SDL3's headers.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Lands in /opt/homebrew/opt/sdl3, which buildSrc/src/main/kotlin/Sdl3.kt checks first.
      - name: Install SDL3
        run: brew install sdl3

      - name: Read Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/.*kotlin-gradle-plugin:\([^"]*\)".*/\1/p' buildSrc/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # The Kotlin/Native compiler and its LLVM toolchain download into ~/.konan on first use.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # "basic" is the open-source cache; the default "enhanced" one is under separate terms of use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # One site over klyph and klyph-platform, written to build/dokka/html.
      - name: Generate the API reference
        run: ./gradlew --no-daemon dokkaGenerate

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
