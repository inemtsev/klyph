name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    # Apple silicon, so the build picks the macosArm64 target with no flags.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Lands in /opt/homebrew/opt/sdl3, which the klyph plugin's Sdl3Locator checks first; the
      # engine build sets klyph.sdl3.download=false, so nothing is downloaded.
      - name: Install SDL3
        run: brew install sdl3

      - name: Read Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/.*kotlin-gradle-plugin:\([^"]*\)".*/\1/p' buildSrc/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # The Kotlin/Native compiler and its LLVM toolchain download into ~/.konan on first use.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # "basic" is the open-source cache; the default "enhanced" one is under separate terms of use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test and link
        run: >-
          ./gradlew --no-daemon
          check
          :sandbox:linkDebugExecutableMacosArm64
          :games:shooter:linkDebugExecutableMacosArm64
          :benchmarks:linkReleaseExecutableMacosArm64

      # Runs the sandbox offscreen for 30 frames and saves frame 20 as a PNG, so every push
      # has a picture. A relative screenshot path resolves against the repository root, and
      # the capture creates its folder.
      # The runner has a GPU, so the step fails if no picture was written.
      - name: Screenshot
        run: |
          ./gradlew --no-daemon :sandbox:run -Pklyph.offscreen=1 -Pklyph.frames=30 -Pklyph.screenshot=20:build/screenshots/sandbox.png
          test -f build/screenshots/sandbox.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-macos
          path: build/screenshots/
          if-no-files-found: error

      # Builds the klibs of every target and the cinterop klibs, and publishes them to ~/.m2 as a
      # release would. Unsigned: signing runs only when signingInMemoryKey is set, and CI has none.
      - name: Publish to mavenLocal
        run: ./gradlew --no-daemon publishToMavenLocal -Pklyph.targets=all

      # The plugin's unit and TestKit tests, then its jar and marker to ~/.m2 for the consumer test.
      - name: Test and publish the Gradle plugin to mavenLocal
        run: ./gradlew --no-daemon -p klyph-gradle-plugin check publishToMavenLocal

      # A fresh project outside the repository builds the shooter from the artifacts in ~/.m2 with
      # only the plugin line, klyph { } and the dependency, then zips it and checks the zip.
      # The runner has no display or GPU, so the game is linked, not run.
      - name: Consumer test
        env:
          KLYPH_CONSUMER_RUN: "0"
        run: tools/consumer-test.sh local

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Ubuntu 24.04 has no SDL3 package, so SDL is built from this release tag and cached.
      SDL3_VERSION: "3.4.18"
    steps:
      - uses: actions/checkout@v7

      - name: Set SDL3 install folder
        run: echo "SDL3_PREFIX=$HOME/sdl3" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SDL3_PREFIX }}
          key: sdl3-${{ env.SDL3_VERSION }}-ubuntu-24.04-${{ runner.arch }}

      # Development packages from SDL's docs/README-linux.md, so the library gets the X11,
      # Wayland and audio backends a desktop build has. SDL loads them at runtime.
      - name: Build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
          git clone --depth 1 --branch "release-$SDL3_VERSION" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl-src"
          # CMAKE_INSTALL_LIBDIR=lib: the build looks for lib/, not lib/x86_64-linux-gnu/.
          cmake -S "$RUNNER_TEMP/sdl-src" -B "$RUNNER_TEMP/sdl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL3_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl-build"
          cmake --install "$RUNNER_TEMP/sdl-build"

      - name: Read Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/.*kotlin-gradle-plugin:\([^"]*\)".*/\1/p' buildSrc/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # The Kotlin/Native compiler and its LLVM toolchain download into ~/.konan on first use.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # "basic" is the open-source cache; the default "enhanced" one is under separate terms of use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Binaries get an rpath to $SDL3_PREFIX/lib, so test executables find libSDL3.so at runtime.
      - name: Test and link
        run: >-
          ./gradlew --no-daemon
          -Psdl3.prefix="$SDL3_PREFIX"
          check
          :sandbox:linkDebugExecutableLinuxX64
          :games:shooter:linkDebugExecutableLinuxX64
          :benchmarks:linkReleaseExecutableLinuxX64

      # Runs the sandbox offscreen for 30 frames and saves frame 20 as a PNG, so every push
      # has a picture. A relative screenshot path resolves against the repository root, and
      # the capture creates its folder.
      # Informational only: the runner has no GPU, and SDL_GPU needs a device even offscreen,
      # so the run is expected to fail here. It must pass on macOS.
      - name: Screenshot
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -Psdl3.prefix="$SDL3_PREFIX" :sandbox:run -Pklyph.offscreen=1 -Pklyph.frames=30 -Pklyph.screenshot=20:build/screenshots/sandbox.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-linux
          path: build/screenshots/
          if-no-files-found: ignore

      # Every target except macosArm64, which Kotlin/Native builds only on macOS. Unsigned:
      # signing runs only when signingInMemoryKey is set, and CI has none.
      - name: Publish to mavenLocal
        run: ./gradlew --no-daemon -Psdl3.prefix="$SDL3_PREFIX" publishToMavenLocal -Pklyph.targets=all

      # The plugin's unit and TestKit tests, then its jar and marker to ~/.m2 for the consumer test.
      - name: Test and publish the Gradle plugin to mavenLocal
        run: ./gradlew --no-daemon -p klyph-gradle-plugin check publishToMavenLocal

      # A fresh project outside the repository builds the shooter from the artifacts in ~/.m2 with
      # only the plugin line, klyph { } and the dependency, then zips it and checks the zip.
      # The script passes $SDL3_PREFIX on as sdl3.prefix, the SDL built above.
      # The runner has no display or GPU, so the game is linked, not run.
      - name: Consumer test
        env:
          KLYPH_CONSUMER_RUN: "0"
        run: tools/consumer-test.sh local

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # Builds the mingwX64 target. The tests open no window, so this job proves the compile, the
  # SDL3 cinterop, the link and the pure-Kotlin tests; the D3D12 rendering path never runs here.
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      SDL3_VERSION: "3.4.18"
    defaults:
      run:
        shell: bash
    steps:
      # The runner's Git converts line endings to CRLF on checkout, which breaks ./gradlew in bash.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # SDL's own MinGW development package: headers, the import library libSDL3.dll.a and an
      # SDL3.dll that needs only system DLLs. MSYS2's SDL3.dll also needs libiconv-2.dll.
      # Gradle gets the prefix as a Windows path with forward slashes, which the JDK reads directly.
      - name: Install SDL3
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o sdl3.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-devel-$SDL3_VERSION-mingw.tar.gz"
          tar -xzf sdl3.tar.gz
          echo "SDL3_PREFIX=${RUNNER_TEMP//\\//}/SDL3-$SDL3_VERSION/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      - name: Read Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/.*kotlin-gradle-plugin:\([^"]*\)".*/\1/p' buildSrc/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # The Kotlin/Native compiler and its LLVM and MinGW toolchains download into ~/.konan on first use.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # "basic" is the open-source cache; the default "enhanced" one is under separate terms of use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Every link copies SDL3.dll from $SDL3_PREFIX/bin next to its binary, so test executables
      # find it at run time.
      - name: Test and link
        run: >-
          ./gradlew --no-daemon
          -Psdl3.prefix="$SDL3_PREFIX"
          check
          :sandbox:linkDebugExecutableMingwX64
          :games:shooter:linkDebugExecutableMingwX64
          :benchmarks:linkReleaseExecutableMingwX64

      # Runs the sandbox offscreen for 30 frames and saves frame 20 as a PNG, so every push
      # has a picture. A relative screenshot path resolves against the repository root, and
      # the capture creates its folder.
      # Informational only: the runner has no GPU, and SDL_GPU needs a device even offscreen,
      # so the run is expected to fail here. It must pass on macOS.
      - name: Screenshot
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -Psdl3.prefix="$SDL3_PREFIX" :sandbox:run -Pklyph.offscreen=1 -Pklyph.frames=30 -Pklyph.screenshot=20:build/screenshots/sandbox.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-windows
          path: build/screenshots/
          if-no-files-found: ignore

      # Every target except macosArm64, which Kotlin/Native builds only on macOS. Unsigned:
      # signing runs only when signingInMemoryKey is set, and CI has none.
      - name: Publish to mavenLocal
        run: ./gradlew --no-daemon -Psdl3.prefix="$SDL3_PREFIX" publishToMavenLocal -Pklyph.targets=all

      # The plugin's unit and TestKit tests, then its jar and marker to ~/.m2 for the consumer test.
      - name: Test and publish the Gradle plugin to mavenLocal
        run: ./gradlew --no-daemon -p klyph-gradle-plugin check publishToMavenLocal

      # A fresh project outside the repository builds the shooter from the artifacts in ~/.m2 with
      # only the plugin line, klyph { } and the dependency, then zips it and checks the zip.
      # The script passes $SDL3_PREFIX on as sdl3.prefix, so the zip gets that SDL3.dll.
      # The runner has no display or GPU, so the game is linked, not run.
      - name: Consumer test
        env:
          KLYPH_CONSUMER_RUN: "0"
        run: tools/consumer-test.sh local

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
