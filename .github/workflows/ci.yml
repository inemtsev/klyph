name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "klyph-gradle-plugin/README.md"
      - "tools/template/README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "klyph-gradle-plugin/README.md"
      - "tools/template/README.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    # Apple silicon, so the build picks the macosArm64 target with no flags.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-klyph

      # detekt and its custom-rule tests are OS-independent JVM checks and run on Linux.
      - name: Test and link
        run: >-
          ./gradlew
          check -x detekt
          :sandbox:linkDebugExecutableMacosArm64
          :games:shooter:linkDebugExecutableMacosArm64
          :benchmarks:linkReleaseExecutableMacosArm64

      # Runs the linked sandbox binary offscreen for 30 frames and saves frame 20 as a PNG, so
      # every push has a picture. The runner has a GPU, so the step fails if no picture was written.
      - name: Screenshot
        env:
          KLYPH_OFFSCREEN: "1"
          KLYPH_FRAMES: "30"
          KLYPH_SCREENSHOT: "20:build/screenshots/sandbox.png"
        run: |
          ./sandbox/build/bin/macosArm64/debugExecutable/sandbox.kexe
          test -f build/screenshots/sandbox.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-macos
          path: build/screenshots/
          if-no-files-found: error

      # Builds the klibs of every target and the cinterop klibs, publishes them and the Gradle
      # plugin to ~/.m2, and runs the plugin's unit and TestKit tests on the same warm daemon.
      # Unsigned: signing runs only when signingInMemoryKey is set, and CI has none.
      - name: Publish to mavenLocal and test Gradle plugin
        run: >-
          ./gradlew
          publishToMavenLocal
          -Pklyph.targets=all
          :klyph-gradle-plugin:check
          :klyph-gradle-plugin:publishToMavenLocal
          -x :klyph-gradle-plugin:detekt

      # Free the 4g daemon heap before the consumer test starts its own Gradle build.
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop

      # A fresh project outside the repository builds the shooter from the artifacts in ~/.m2 with
      # only the plugin line, klyph { } and the dependency, then zips it and checks the zip.
      # The runner has no display or GPU, so the game is linked, not run.
      - name: Consumer test
        env:
          KLYPH_CONSUMER_RUN: "0"
        run: tools/consumer-test.sh local

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-klyph

      # Binaries get an rpath to $SDL3_PREFIX/lib, so test executables find libSDL3.so at runtime.
      # Linux also runs detekt across every module and tests klyph's own detekt rules.
      - name: Test and link
        run: >-
          ./gradlew
          -Psdl3.prefix="$SDL3_PREFIX"
          check
          :detekt-rules:check
          :sandbox:linkDebugExecutableLinuxX64
          :games:shooter:linkDebugExecutableLinuxX64
          :benchmarks:linkReleaseExecutableLinuxX64

      # Every target except macosArm64, which Kotlin/Native builds only on macOS, plus the Gradle
      # plugin's tests and ~/.m2 publication on the same warm daemon. Unsigned: signing runs only
      # when signingInMemoryKey is set, and CI has none.
      - name: Publish to mavenLocal and test Gradle plugin
        run: >-
          ./gradlew
          -Psdl3.prefix="$SDL3_PREFIX"
          publishToMavenLocal
          -Pklyph.targets=all
          :klyph-gradle-plugin:check
          :klyph-gradle-plugin:publishToMavenLocal

      # Free the 4g daemon heap before the consumer test starts its own Gradle build.
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop

      # A fresh project outside the repository builds the shooter from the artifacts in ~/.m2 with
      # only the plugin line, klyph { } and the dependency, then zips it and checks the zip.
      # The script passes $SDL3_PREFIX on as sdl3.prefix, the SDL built above.
      # The runner has no display or GPU, so the game is linked, not run.
      - name: Consumer test
        env:
          KLYPH_CONSUMER_RUN: "0"
        run: tools/consumer-test.sh local

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # Builds the mingwX64 target. The tests open no window, so this job proves the compile, the
  # SDL3 cinterop, the link and the pure-Kotlin tests; the D3D12 rendering path never runs here.
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The runner's Git converts line endings to CRLF on checkout, which breaks ./gradlew in bash.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-klyph

      # Every link copies SDL3.dll from $SDL3_PREFIX/bin next to its binary, so test executables
      # find it at run time. detekt and its custom-rule tests run on Linux.
      - name: Test and link
        run: >-
          ./gradlew
          -Psdl3.prefix="$SDL3_PREFIX"
          check -x detekt
          :sandbox:linkDebugExecutableMingwX64
          :games:shooter:linkDebugExecutableMingwX64
          :benchmarks:linkReleaseExecutableMingwX64

      # Runs the linked sandbox binary offscreen for 30 frames and saves frame 20 as a PNG.
      # Informational only: must pass on macOS.
      - name: Screenshot
        continue-on-error: true
        env:
          KLYPH_OFFSCREEN: "1"
          KLYPH_FRAMES: "30"
          KLYPH_SCREENSHOT: "20:build/screenshots/sandbox.png"
        run: ./sandbox/build/bin/mingwX64/debugExecutable/sandbox.exe

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-windows
          path: build/screenshots/
          if-no-files-found: ignore

      # Every target except macosArm64, which Kotlin/Native builds only on macOS, plus the Gradle
      # plugin's tests and ~/.m2 publication on the same warm daemon. Unsigned: signing runs only
      # when signingInMemoryKey is set, and CI has none.
      - name: Publish to mavenLocal and test Gradle plugin
        run: >-
          ./gradlew
          -Psdl3.prefix="$SDL3_PREFIX"
          publishToMavenLocal
          -Pklyph.targets=all
          :klyph-gradle-plugin:check
          :klyph-gradle-plugin:publishToMavenLocal
          -x :klyph-gradle-plugin:detekt

      # Free the 4g daemon heap before the consumer test starts its own Gradle build and ensure
      # no daemon holds cache locks if an earlier step failed.
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop

      # A fresh project outside the repository builds the shooter from the artifacts in ~/.m2 with
      # only the plugin line, klyph { } and the dependency, then zips it and checks the zip.
      # The script passes $SDL3_PREFIX on as sdl3.prefix, so the zip gets that SDL3.dll.
      # The runner has no display or GPU, so the game is linked, not run.
      - name: Consumer test
        env:
          KLYPH_CONSUMER_RUN: "0"
        run: tools/consumer-test.sh local

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
